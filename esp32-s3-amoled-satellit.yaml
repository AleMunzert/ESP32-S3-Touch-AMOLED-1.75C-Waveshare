touchscreen:
  - platform: cst9220
    id: my_touchscreen
    i2c_id: bus_a
    interrupt_pin: GPIO11
    reset_pin: GPIO2
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      then:
        - script.execute: activity_timer
        - binary_sensor.template.publish:
            id: touch_input
            state: ON
    on_release:
      then:
        - binary_sensor.template.publish:
            id: touch_input
            state: OFF

micro_wake_word:
  id: mww
  vad:
  models:
    - model: okay_nabu
      id: okay_nabu_model
    - model: /config/esphome/hey_georgsch.json
      id: hey_georgsch_model
      probability_cutoff: 70%
    - model: /config/esphome/hai_dschoartsch.json
      id: hai_dschoartsch_model
      probability_cutoff: 85%
  on_wake_word_detected:
    # Jede Erkennung (auch Fehltreffer) mit Wake-Word-Phrase an HA melden
    - homeassistant.event:
        event: esphome.georg_kueche_wake_word
        data:
          wake_word: !lambda 'return wake_word;'
    - if:
        condition:
          voice_assistant.is_running:
        then:
          - voice_assistant.stop:
          - delay: 300ms
    - homeassistant.action:
        action: media_player.media_stop
        data:
          entity_id: !lambda 'return id(target_media_player).current_option();'
    - delay: 300ms
    - if:
        condition:
          switch.is_on: wake_sound
        then:
          - homeassistant.action:
              action: media_player.play_media
              data:
                entity_id: !lambda 'return id(target_media_player).current_option();'
                media_content_id: "https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac"
                media_content_type: "music"
                announce: "true"
    - delay: 300ms
    - voice_assistant.start:
    # Display-Refresh (Aufwachen aus Screensaver/Dimmung) erst NACH dem
    # Wake-Sound + Mikro-Start anstoßen - der Redraw kann bis zu ~1,2s
    # dauern und hat vorher den Wake-Sound spuerbar verzoegert.
    - script.execute: activity_timer

voice_assistant:
  id: va
  microphone: box_mic
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 1.0
  on_start:
    # Neue Runde: erstmal davon ausgehen, dass danach KEINE Folgefrage
    # ansteht (wird ggf. in on_tts_start korrigiert)
    - lambda: id(folgefrage_erwartet) = false;
  on_listening:
    - script.execute: activity_timer
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
    - text_sensor.template.publish: { id: text_request, state: "..." }
    - text_sensor.template.publish: { id: text_response, state: "..." }
    - script.execute: draw_display
  on_stt_vad_end:
    - script.execute: activity_timer
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: draw_display
  on_stt_end:
    - lambda: 'id(text_request).publish_state(x);'
    - script.execute: draw_display
  on_tts_start:
    - script.execute: activity_timer
    - lambda: 'id(text_response).publish_state(x);'
    - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
    - script.execute: draw_display
    - lambda: |-
        std::string antwort = x;
        while (!antwort.empty() && (antwort.back() == ' ' || antwort.back() == '\n' ||
                                     antwort.back() == '\r' || antwort.back() == '\t')) {
          antwort.pop_back();
        }
        id(folgefrage_erwartet) = !antwort.empty() && antwort.back() == '?';
  on_tts_end:
    - homeassistant.action:
        action: media_player.play_media
        data:
          entity_id: !lambda 'return id(target_media_player).current_option();'
          media_content_id: !lambda 'return x;'
          media_content_type: "music"
          announce: "true"
  on_end:
    - script.execute: activity_timer
    - if:
        condition:
          and:
            - switch.is_off: mute
            - lambda: return id(folgefrage_erwartet);
        then:
          # Georg hat eine Rückfrage gestellt -> warten bis die Antwort in
          # der Küche läuft und wieder fertig ist, dann OHNE Wake Word
          # direkt weiterhören
          - wait_until:
              condition:
                lambda: return id(kueche_wiedergabe_status).state == "playing";
              timeout: 5s
          - wait_until:
              condition:
                lambda: return id(kueche_wiedergabe_status).state != "playing";
              timeout: 30s
          - lambda: id(folgefrage_erwartet) = false;
          # Ohne Wake Word geht's direkt weiter - Wake-Sound trotzdem
          # abspielen, damit hoerbar ist, dass das Mikro jetzt wieder aktiv
          # zuhoert (Rueckfrage).
          - if:
              condition:
                switch.is_on: wake_sound
              then:
                - homeassistant.action:
                    action: media_player.play_media
                    data:
                      entity_id: !lambda 'return id(target_media_player).current_option();'
                      media_content_id: "https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac"
                      media_content_type: "music"
                      announce: "true"
                - delay: 300ms
          - if:
              condition:
                lambda: return id(wake_word_engine_location).current_option() == "On device";
              then:
                - voice_assistant.start:
              else:
                - lambda: id(va).set_use_wake_word(true);
                - voice_assistant.start_continuous:
        else:
          # Normales Ende, keine Rückfrage (oder gemutet) -> zurück in den
          # Wake-Word-Modus wie bisher
          - delay: 3s
          - if:
              condition:
                lambda: return id(wake_word_engine_location).current_option() == "On device";
              then:
                - lambda: id(va).set_use_wake_word(false);
                - delay: 500ms
                - micro_wake_word.stop:
                - delay: 300ms
                - micro_wake_word.start:
          - if:
              condition:
                lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
              then:
                - if:
                    condition:
                      switch.is_off: mute
                    then:
                      - script.execute: start_wake_word
          - script.execute: set_idle_or_mute_phase
          - script.execute: draw_display
          - text_sensor.template.publish: { id: text_request, state: "" }
          - text_sensor.template.publish: { id: text_response, state: "" }
  on_error:
    - lambda: id(folgefrage_erwartet) = false;
    - delay: 100ms
    - if:
        condition:
          lambda: return !id(init_in_progress);
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: draw_display
          - delay: 2s
          - script.execute: stop_wake_word
          - delay: 500ms
          - if:
              condition:
                switch.is_off: mute
              then:
                - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
                - script.execute: start_wake_word
              else:
                - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
                - script.execute: draw_display
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - if:
        condition:
          switch.is_on: mute
        then:
          - microphone.mute:
        else:
          - microphone.unmute:
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
    - script.execute: activity_timer
  on_client_disconnected:
    - lambda: id(folgefrage_erwartet) = false;
    - script.execute: stop_wake_word
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: draw_display

select:
  - platform: template
    entity_category: config
    name: Wake word engine location
    id: wake_word_engine_location
    icon: "mdi:account-voice"
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    initial_option: In Home Assistant
    on_value:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - wait_until:
                condition:
                  lambda: return id(voice_assistant_phase) == ${voice_assist_muted_phase_id} || id(voice_assistant_phase) == ${voice_assist_idle_phase_id};
                timeout: 10s
            - if:
                condition:
                  lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
                then:
                  - micro_wake_word.stop:
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - lambda: id(va).set_use_wake_word(true);
                        - voice_assistant.start_continuous:
            - if:
                condition:
                  lambda: return id(wake_word_engine_location).current_option() == "On device";
                then:
                  - lambda: id(va).set_use_wake_word(false);
                  - voice_assistant.stop:
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - micro_wake_word.stop:
                        - delay: 300ms
                        - micro_wake_word.start:

  - platform: template
    entity_category: config
    name: Zielsprecher
    id: target_media_player
    icon: "mdi:speaker"
    optimistic: true
    restore_value: true
    options:
      - media_player.kueche
    initial_option: media_player.kueche

switch:
  - platform: template
    name: Mute
    id: mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - microphone.unmute:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
            - script.execute: draw_display
    on_turn_on:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - microphone.mute:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
            - script.execute: draw_display
  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: show_text
    name: Show Text
    icon: "mdi:card-text-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

globals:
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"
  - id: voice_assistant_phase
    type: int
    restore_value: false
    initial_value: ${voice_assist_not_ready_phase_id}
  - id: screensaver_active
    type: bool
    restore_value: false
    initial_value: "false"
  # NEU: merkt sich, ob Georgs letzte Antwort eine Rückfrage war (Text
  # endete auf "?") -> steuert in on_end, ob ohne Wake Word weitergehört wird
  - id: folgefrage_erwartet
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: draw_display
    then:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - if:
                      condition:
                        api.connected:
                      then:
                        - lambda: |
                            switch (id(voice_assistant_phase)) {
                              case ${voice_assist_listening_phase_id}:
                                id(main_display).show_page(listening_page);
                                id(main_display).update();
                                break;
                              case ${voice_assist_thinking_phase_id}:
                                id(main_display).show_page(thinking_page);
                                id(main_display).update();
                                break;
                              case ${voice_assist_replying_phase_id}:
                                id(main_display).show_page(replying_page);
                                id(main_display).update();
                                break;
                              case ${voice_assist_error_phase_id}:
                                id(main_display).show_page(error_page);
                                id(main_display).update();
                                break;
                              case ${voice_assist_muted_phase_id}:
                                id(main_display).show_page(muted_page);
                                id(main_display).update();
                                break;
                              case ${voice_assist_not_ready_phase_id}:
                                id(main_display).show_page(no_ha_page);
                                id(main_display).update();
                                break;
                              default:
                                if (id(screensaver_active)) {
                                  id(main_display).show_page(screensaver_page);
                                } else {
                                  id(main_display).show_page(idle_page);
                                }
                                id(main_display).update();
                            }
                      else:
                        - display.page.show: no_ha_page
                        - component.update: main_display
                else:
                  - display.page.show: no_wifi_page
                  - component.update: main_display
          else:
            - display.page.show: initializing_page
            - component.update: main_display

  - id: activity_timer
    mode: restart
    then:
      - lambda: id(screensaver_active) = false;
      - lambda: id(main_display).set_brightness(static_cast<uint8_t>(id(screen_brightness).state));
      - if:
          condition:
            lambda: return id(voice_assistant_phase) == ${voice_assist_idle_phase_id};
          then:
            - script.execute: draw_display
      - delay: 2min
      - lambda: id(screensaver_active) = true;
      - lambda: id(main_display).set_brightness(51);
      - script.execute: draw_display
      - delay: 2min
      - lambda: id(main_display).set_brightness(0);

  - id: start_wake_word
    then:
      - delay: 1s
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - delay: 500ms
            - if:
                condition:
                  not:
                    micro_wake_word.is_running:
                then:
                  - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - delay: 500ms
            - voice_assistant.start_continuous:

  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - delay: 300ms
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - if:
                condition:
                  micro_wake_word.is_running:
                then:
                  - micro_wake_word.stop:

  - id: set_idle_or_mute_phase
    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          else:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};

button:
  - platform: factory_reset
    id: factory_reset_btn
    internal: true
  - platform: restart
    id: reboot_btn
    name: "Reboot Device"
    icon: "mdi:restart"
    entity_category: config

binary_sensor:
  - platform: template
    name: "Touch Button"
    id: touch_input
    on_multi_click:
      - timing:
          - ON for 40ms to 400ms
          - OFF for at least 330ms
        then:
          - if:
              condition:
                not:
                  voice_assistant.is_running:
              then:
                - if:
                    condition:
                      lambda: return id(wake_word_engine_location).current_option() == "On device";
                    then:
                      - micro_wake_word.stop:
                      - delay: 300ms
                - voice_assistant.start:
              else:
                - voice_assistant.stop:

  - platform: gpio
    pin:
      number: 0
      mode: INPUT_PULLUP
      ignore_strapping_warning: true
      inverted: true
    id: left_top_button
    internal: true
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 50ms
        then:
          - if:
              condition:
                not:
                  voice_assistant.is_running:
              then:
                - if:
                    condition:
                      lambda: return id(wake_word_engine_location).current_option() == "On device";
                    then:
                      - micro_wake_word.stop:
                      - delay: 300ms
                - voice_assistant.start:
              else:
                - voice_assistant.stop:
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_btn

  - platform: template
    name: "Battery Charging"
    id: battery_charging
    device_class: battery_charging
    entity_category: diagnostic

sensor:
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    entity_category: diagnostic
    icon: "mdi:battery"
    update_interval: 30s
    lambda: |-
      i2c::I2CDevice axp;
      axp.set_i2c_bus(id(bus_a));
      axp.set_i2c_address(0x34);
      uint8_t pct = 0;
      if (axp.read_register(0xA4, &pct, 1) == i2c::ERROR_OK && pct <= 100) {
        return (float) pct;
      }
      return {};
  - platform: template
    name: "Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      i2c::I2CDevice axp;
      axp.set_i2c_bus(id(bus_a));
      axp.set_i2c_address(0x34);
      uint8_t hi = 0, lo = 0;
      if (axp.read_register(0x34, &hi, 1) == i2c::ERROR_OK &&
          axp.read_register(0x35, &lo, 1) == i2c::ERROR_OK) {
        uint16_t mv = ((hi & 0x3F) << 8) | lo;
        return mv / 1000.0f;
      }
      return {};

interval:
  - interval: 30s
    then:
      - lambda: |-
          i2c::I2CDevice axp;
          axp.set_i2c_bus(id(bus_a));
          axp.set_i2c_address(0x34);
          uint8_t status = 0;
          if (axp.read_register(0x01, &status, 1) == i2c::ERROR_OK) {
            id(battery_charging).publish_state((status & 0x60) == 0x20);
          }


# =============================================================================
# G.E.O.R.G. — ESP32-S3-Touch-AMOLED-1.75C Sprachsatellit
# Externe Wiedergabe (kein lokaler Lautsprecher aktiv — Umgehung des
# ESPHome-i2s_audio-DMA-Bugs, Issue #16755, weiterhin offen)
# ENTFERNT: Mikrofon-Diagnose-Sensoren (Peak/Chunks/Bytes) — nicht mehr
# nötig, Audio-Pipeline läuft stabil; verursachten unnötigen Log-Spam.
# =============================================================================

substitutions:
  # Eigene G.E.O.R.G.-Badges (ersetzen die ESPHome-Standard-"casita"-Grafiken).
  # Lokale Dateien unter /config/esphome/esp_assets/images/ (siehe image:-Block unten).
  loading_illustration_file: esp_assets/images/georg_laden_initialisierung.png
  idle_illustration_file: esp_assets/images/georg_ruhezustand.png
  listening_illustration_file: esp_assets/images/georg_zuhoeren.png
  thinking_illustration_file: esp_assets/images/georg_denken_verarbeiten.png
  replying_illustration_file: esp_assets/images/georg_antworten.png
  mute_illustration_file: esp_assets/images/georg_stummgeschaltet.png
  error_illustration_file: esp_assets/images/georg_fehler.png
  error_no_wifi_file: esp_assets/images/georg_kein_wlan.png
  error_no_ha_file: esp_assets/images/georg_keine_ha_verbindung.png
  idle_illustration_background_color: "000000"
  listening_illustration_background_color: "000000"
  thinking_illustration_background_color: "000000"
  replying_illustration_background_color: "000000"
  loading_illustration_background_color: "000000"
  error_illustration_background_color: "000000"
  voice_assist_idle_phase_id: "1"
  voice_assist_listening_phase_id: "2"
  voice_assist_thinking_phase_id: "3"
  voice_assist_replying_phase_id: "4"
  voice_assist_not_ready_phase_id: "10"
  voice_assist_error_phase_id: "11"
  voice_assist_muted_phase_id: "12"
  font_family: Figtree
  font_glyphsets: GF_Latin_Core

esphome:
  name: s3xy-amoled-lux-175
  friendly_name: GEORG Küche
  min_version: 2026.8.0
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - script.execute: draw_display
      - delay: 30s
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - lambda: id(init_in_progress) = false;
            - script.execute: draw_display
            - script.execute: activity_timer
      - micro_wake_word.enable_model: hey_georgsch_model
      - micro_wake_word.enable_model: hai_dschoartsch_model

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: draw_display

ota:
  - platform: esphome

logger:
  level: VERBOSE
  hardware_uart: USB_SERIAL_JTAG
  logs:
    micro_wake_word: VERBOSE

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: !secret static_ip
    gateway: !secret gateway
    subnet: 255.255.255.0
    dns1: !secret gateway
  ap:
    ssid: "Georg-Satellit Fallback"
    password: !secret ap_password
  on_connect:
    - script.execute: draw_display
  on_disconnect:
    - script.execute: draw_display

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

i2c:
  - id: bus_a
    scl: GPIO14
    sda: GPIO15
    scan: false

i2s_audio:
  - id: i2s_in
    i2s_mclk_pin: GPIO16
    i2s_bclk_pin: GPIO9
    i2s_lrclk_pin: GPIO45

audio_adc:
  - platform: es7210
    i2c_id: bus_a
    id: es7210_adc
    address: 0x40
    mic_gain: "24"
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO10
    adc_type: external
    pdm: false
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit
    use_apll: false

spi:
  - id: display_spi
    type: quad
    clk_pin: GPIO38
    data_pins: [4, 5, 6, 7]

display:
  - platform: mipi_spi
    model: CO5300
    id: main_display
    spi_id: display_spi
    cs_pin: GPIO12
    reset_pin: GPIO1
    bus_mode: quad
    dimensions:
      width: 466
      height: 466
    color_order: RGB
    invert_colors: false
    brightness: 255
    update_interval: never
    pages:
      - id: idle_page
        lambda: |-
          it.image(233, 233, id(casita_idle), ImageAlign::CENTER);
          it.printf(233, 370, id(font_response), Color::WHITE, TextAlign::CENTER, "Home Assistant");
          if (id(ha_time).now().is_valid()) {
            it.strftime(20, 24, id(font_battery), Color::WHITE, TextAlign::TOP_LEFT, "%H:%M", id(ha_time).now());
          }
          {
            int batt_pct = (int) roundf(id(battery_level).state);
            if (!std::isnan(id(battery_level).state)) {
              bool charging = id(battery_charging).state;
              int bx = 216, by = 16, bw = 34, bh = 16;
              int nub_w = 3, nub_h = 8;
              Color batt_color = charging ? Color(0, 200, 0) : Color::WHITE;
              it.rectangle(bx, by, bw, bh, batt_color);
              it.filled_rectangle(bx + bw, by + (bh - nub_h) / 2, nub_w, nub_h, batt_color);
              int fill_w = (int) ((bw - 4) * std::max(0, std::min(100, batt_pct)) / 100.0f);
              if (fill_w > 0) it.filled_rectangle(bx + 2, by + 2, fill_w, bh - 4, batt_color);
              if (charging) {
                it.filled_triangle(bx + bw / 2 + 3, by - 2, bx + bw / 2 - 4, by + bh / 2, bx + bw / 2 + 1, by + bh / 2, Color(255, 215, 0));
                it.filled_triangle(bx + bw / 2 + 1, by + bh / 2, bx + bw / 2 - 2, by + bh + 2, bx + bw / 2 + 5, by + bh / 2 - 1, Color(255, 215, 0));
              }
              it.printf(bx + bw / 2, by + bh + 10, id(font_battery), batt_color, TextAlign::TOP_CENTER, "%d%%", batt_pct);
            }
          }
      - id: screensaver_page
        lambda: |-
          it.fill(Color::BLACK);
          if (id(ha_time).now().is_valid()) {
            it.strftime(233, 233, id(font_clock), Color::WHITE, TextAlign::CENTER, "%H:%M", id(ha_time).now());
